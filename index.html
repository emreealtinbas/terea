<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Bütçe & Terea — Gelir, gider, tasarruf hedefleri ve Terea tüketim kontrolünü tek bir sade panelde yöneten kişisel finans uygulaması." />
  <meta name="theme-color" content="#0C0E13" />

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bütçe & Terea" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Bütçe &amp; Terea — Kişisel Finans</title>

  <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Design System & Stylesheets (Vanilla CSS) -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>
<body>
  <div class="app-shell">
    <!-- ==================== DESKTOP SIDEBAR ==================== -->
    <aside class="sidebar" aria-label="Ana gezinme">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <img src="./assets/icon.svg" alt="Bütçe & Terea logosu" width="38" height="38" />
        </div>
        <div class="brand-text">
          <span class="brand-name truncate">Bütçe &amp; Terea</span>
          <span class="brand-sub truncate">Kişisel Finans</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Bölümler">
        <button type="button" class="nav-item is-active" data-route="overview" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
          <span class="truncate">Özet</span>
        </button>

        <button type="button" class="nav-item" data-route="transactions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 6h13" />
            <path d="M8 12h13" />
            <path d="M8 18h13" />
            <path d="M3 6h.01" />
            <path d="M3 12h.01" />
            <path d="M3 18h.01" />
          </svg>
          <span class="truncate">Harcamalar</span>
        </button>

        <button type="button" class="nav-item" data-route="goals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="5" />
            <circle cx="12" cy="12" r="1.5" />
          </svg>
          <span class="truncate">Hedefler</span>
        </button>

        <button type="button" class="nav-item" data-route="terea">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20V10" />
            <path d="M18 20V4" />
            <path d="M6 20v-4" />
          </svg>
          <span class="truncate">Terea Takip</span>
        </button>

        <button type="button" class="nav-item" data-route="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span class="truncate">Ayarlar &amp; Sync</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" id="quickAddBtn" class="btn btn-primary btn-lg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span>İşlem Ekle</span>
          <kbd class="kbd-hint">N</kbd>
        </button>

        <button type="button" id="syncBadgeBtn" class="sync-pill" data-action="open-sync" title="Bulut Senkronizasyon Durumu">
          <span id="syncBadgeDot" class="sync-dot"></span>
          <span id="syncBadgeText" class="truncate">Yerel Mod</span>
        </button>
      </div>
    </aside>

    <!-- ==================== MAIN CONTENT COLUMN ==================== -->
    <div class="app-main">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-titles">
            <h1 id="pageTitle" class="page-title truncate">Finans Özeti</h1>
            <p id="pageSubtitle" class="page-subtitle truncate">Aylık nakit akışı, harcama dengesi ve Terea etkisi</p>
          </div>

          <div class="topbar-actions">
            <div class="month-switcher" role="group" aria-label="Dönem seçimi">
              <button type="button" id="monthPrevBtn" class="month-nav-btn" aria-label="Önceki ay">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="15 18 9 12 15 6" />
                </svg>
              </button>
              <button type="button" id="monthLabel" class="month-label-btn" aria-label="Aktif ay">Kasım 2026</button>
              <button type="button" id="monthNextBtn" class="month-nav-btn" aria-label="Sonraki ay">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="9 18 15 12 9 6" />
                </svg>
              </button>
            </div>

            <button type="button" class="sync-pill mobile-only" data-action="open-sync" aria-label="Senkronizasyon durumu">
              <span class="sync-dot"></span>
              <span class="sync-text truncate">Yerel</span>
            </button>

            <button type="button" id="themeToggleBtn" class="icon-btn" aria-label="Tema değiştir" title="Tema değiştir">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <main id="viewRoot" class="view-root" aria-live="polite"></main>
    </div>
  </div>

  <!-- ==================== MOBILE BOTTOM NAVIGATION ==================== -->
  <nav class="mobile-nav" aria-label="Mobil gezinme">
    <button type="button" class="nav-item is-active" data-route="overview" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="9" rx="1.5" />
        <rect x="14" y="3" width="7" height="5" rx="1.5" />
        <rect x="14" y="12" width="7" height="9" rx="1.5" />
        <rect x="3" y="16" width="7" height="5" rx="1.5" />
      </svg>
      <span>Özet</span>
    </button>

    <button type="button" class="nav-item" data-route="transactions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 6h13" />
        <path d="M8 12h13" />
        <path d="M8 18h13" />
        <path d="M3 6h.01" />
        <path d="M3 12h.01" />
        <path d="M3 18h.01" />
      </svg>
      <span>Harcamalar</span>
    </button>

    <button type="button" class="nav-item" data-route="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="5" />
        <circle cx="12" cy="12" r="1.5" />
      </svg>
      <span>Hedefler</span>
    </button>

    <button type="button" class="nav-item" data-route="terea">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20V10" />
        <path d="M18 20V4" />
        <path d="M6 20v-4" />
      </svg>
      <span>Terea</span>
    </button>

    <button type="button" class="nav-item" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
      <span>Ayarlar</span>
    </button>
  </nav>

  <!-- ==================== MOBILE FLOATING ACTION BUTTON ==================== -->
  <button type="button" id="fabQuickAdd" class="fab" aria-label="Hızlı işlem ekle">+</button>

  <!-- ==================== GLOBAL MODAL OVERLAY ==================== -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">İşlem</h2>
        <button type="button" id="modalCloseBtn" class="icon-btn" aria-label="Pencereyi kapat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- ==================== TOAST & CHART TOOLTIP ==================== -->
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="chartTooltip" class="chart-tooltip hidden" role="tooltip"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
